# dsh-tui 的 bundle 补丁层：一个纯 stdio 的交互式前端。
#
# 与官方 headless bundle 的差别只有一处值得一提：
#   headless 把 credentials 关掉，改用启动时的环境变量；
#   TUI 是交互式的，所以**保留** credentials，直接读 $DSH_HOME/.credentials.yaml，
#   不需要在启动前 export 任何 key。
#
# 这里关掉的三个：
#   hmr            —— 终端里没有热更新界面
#   authorization  —— 本插件没有审批 UI，先按全放行处理（见 README 的已知限制）
#   deepseek-account —— 交互式 CLI 不做账号页

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- insert:
    # 解析 `dsh tui` 自己的命令行（--session-id / --model / --no-reasoning）
    - id: tui-startup
      name: 'dsh-tui/startup'

    # 读 tuiStartup 服务，建 Agent，然后进 REPL
    - id: tui-runner
      name: 'dsh-tui'
      inject: [tuiStartup]
      config:
        sessionId: !!js ctx.tuiStartup.sessionId
        model: !!js ctx.tuiStartup.model
        reasoning: !!js ctx.tuiStartup.reasoning

- id: hmr
  disabled: true

- id: authorization
  disabled: true

- id: deepseek-account
  disabled: true
